# The base configuration of Venom: what a run takes when neither the .venomrc of the folder nor that of the home sets
# the key. A key set in a .venomrc replaces the base value as a whole.

# outcomes are the testcase outcomes written in the names of the protocols and of their testsuite folders, any of
# ok, partial, failed, not-run: ok passed, partial failed with an assertion held, failed failed with none held, not-run
# did not run or has not ended (skipped, interrupted, never started, pending), never failed. An outcome left out is not
# written: its protocol and folder carry the name alone.
outcomes:
  - ok
  - partial
  - failed
  - not-run

# criticality is the scale of how critical the problem of a testcase that did not pass is, its levels from the most
# critical down; a testcase declares its level by the info line «criticality: <name>». PROBLEMS.md and REPORT.md order
# the problems by kind, then by this scale; a testcase that declares none is «not set», after every level.
criticality:
  - name: critical
    means: blocks the product, fixed at once
  - name: important
    means: breaks a scenario, fixed in the current iteration
  - name: tolerable
    means: can wait

# kinds are the kinds of the scenario of a testcase from the first to fix; a testcase declares its kind by the info line
# «kind: <name>»; a testcase that declares none is «not set», after every kind.
kinds:
  - name: business
    means: a business scenario, in priority
  - name: technical
    means: a critical technical point, partitions of a database for one
  - name: qa
    means: a scenario of QA only, may wait
